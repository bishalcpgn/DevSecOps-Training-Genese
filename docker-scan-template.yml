parameters:
  imageName: 'genese-demo'
  buildId: '$(Build.BuildId)'

steps:
  - script: |
      echo "Building Docker image..."
      docker build -t ${{ parameters.imageName }}:${{ parameters.buildId }} .

      echo "Installing Trivy..."
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
      sudo mv ./bin/trivy /usr/local/bin/

      echo "Fetching Trivy HTML template..."
    wget -O html.tpl https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
      
      echo "Scanning Docker image with Trivy..."
      trivy image \
        --format template \
        --template "@contrib/html.tpl" \
        --output $(Build.ArtifactStagingDirectory)/trivy-report.json \
        --severity HIGH,CRITICAL \
        --exit-code 0 \
        ${{ parameters.imageName }}:${{ parameters.buildId }}
    displayName: 'Build and Scan Docker Image'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/trivy-report.json'
      ArtifactName: 'docker-scan-report'
      publishLocation: 'Container'
    displayName: 'Publish Docker Scan Report'

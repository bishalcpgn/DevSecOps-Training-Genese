# This template defines reusable steps for building and scanning a Docker image
parameters:
  imageName: 'genese-demo'   # Default value if none provided

steps:
- script: |
    echo "Building Docker image ${{ parameters.imageName }}:$(Build.BuildId)"
    docker build -t ${{ parameters.imageName }}:$(Build.BuildId) .
    echo "Scanning Docker image ${{ parameters.imageName }}:$(Build.BuildId)"
    docker scan ${{ parameters.imageName }}:$(Build.BuildId)
  displayName: 'Build and Scan Docker Image'
